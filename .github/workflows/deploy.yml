name: Deploy (EC2)

# Continuous deploy of apps/api to the EC2 box: lint/type-gate, then hand the
# commit sha to deploy/remote-deploy.sh on the server (sync from origin/dev →
# pnpm install → db:migrate → restart → health check). See DEPLOY.md §1b.
#
# REQUIRED GitHub repo secrets (Settings → Secrets and variables → Actions):
#   EC2_SSH_KEY  — the dedicated CD private key (forced-command only; never the
#                  operator key)
#   EC2_HOST     — api.hgt.todari.dev
# Until both are set the deploy job skips with a warning.

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SECRETS: ${{ secrets.EC2_SSH_KEY != '' && secrets.EC2_HOST != '' }}
    steps:
      - name: Skip if secrets are not configured
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::warning::EC2_SSH_KEY / EC2_HOST not set — skipping deploy. Add them in repo Settings → Secrets."
          exit 0

      - name: Set up SSH
        if: env.HAS_SECRETS == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy this commit (forced command on the server)
        if: env.HAS_SECRETS == 'true'
        # The deploy key is restricted to deploy/remote-deploy.sh, which pulls
        # this commit from origin/dev, installs, migrates, restarts and
        # health-checks. Whatever we send is treated as a commit sha, not a command.
        run: ssh -i ~/.ssh/deploy_key "ubuntu@${{ secrets.EC2_HOST }}" "$GITHUB_SHA"
